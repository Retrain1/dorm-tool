<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>宿舍记账</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- ========== 首页 ========== -->
    <section id="page-home" class="page active">
      <h1 class="page-title">宿舍小账本</h1>

      <!-- 顶部卡片：我的净额 -->
      <div class="card-grid">
        <div class="card card-highlight">
          <div class="card-label" id="home-me-label">我的净额</div>
          <div class="card-value" id="home-my-balance">--</div>
          <div class="card-sub" id="home-my-balance-desc"></div>
        </div>
      </div>

      <!-- 谁欠谁：结算建议 -->
      <div class="card">
        <h2 class="card-title">结算建议（最少转账）</h2>
        <ul class="settle-list" id="home-settle-list"></ul>
      </div>

      <!-- 最近 3 条账单 -->
      <div class="card">
        <h2 class="card-title">最近账单</h2>
        <ul class="bill-list" id="home-recent-bills"></ul>
      </div>
    </section>

    <!-- ========== 记账页 ========== -->
    <section id="page-add" class="page">
      <h1 class="page-title">记一笔</h1>
      <form class="card form" id="form-add">
        <label class="form-field">
          <span class="form-label">事项</span>
          <input type="text" id="add-item" placeholder="例如：买菜 / 洗衣液" required maxlength="20" />
        </label>

        <label class="form-field">
          <span class="form-label">金额（元）</span>
          <input type="number" id="add-amount" placeholder="0.00" required min="0.01" step="0.01" inputmode="decimal" />
        </label>

        <label class="form-field">
          <span class="form-label">垫付人</span>
          <select id="add-payer" required></select>
        </label>

        <div class="form-field">
          <div class="form-label-row">
            <span class="form-label">参与分摊的人</span>
            <button type="button" class="btn-link" id="btn-select-all">全选</button>
          </div>
          <div class="splitter-box" id="add-splitters"></div>
        </div>

        <button type="submit" class="btn-primary">保存账单</button>
      </form>
    </section>

    <!-- ========== 账单页 ========== -->
    <section id="page-bills" class="page">
      <h1 class="page-title">全部账单</h1>
      <div class="card">
        <ul class="bill-list" id="bills-list"></ul>
      </div>
    </section>

    <!-- ========== 成员页 ========== -->
    <section id="page-members" class="page">
      <h1 class="page-title">室友成员</h1>
      <div class="card">
        <ul class="member-list" id="member-list"></ul>
      </div>
      <form class="card form form-row" id="form-member">
        <input type="text" id="member-name" placeholder="输入新成员姓名" required maxlength="10" />
        <button type="submit" class="btn-primary btn-small">添加</button>
      </form>
    </section>

    <!-- ========== 底部导航栏 ========== -->
    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-page="home">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 11l9-8 9 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10v10h5v-6h4v6h5V10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>首页</span>
      </button>
      <button class="tab" data-page="add">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>记账</span>
      </button>
      <button class="tab" data-page="bills">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 4h14v16l-2.5-1.5L14 20l-2-1.5L10 20l-2.5-1.5L5 20V4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 9h6M9 13h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>账单</span>
      </button>
      <button class="tab" data-page="members">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="9" cy="9" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 19c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16 6a3 3 0 110 6M17.5 14.5c2 .5 3.2 1.9 3.8 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>成员</span>
      </button>
    </nav>
  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="toast"></div>

  <script src="calc.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
